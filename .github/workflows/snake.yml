name: Generate Snake

on:
    schedule:
        - cron: "0 */12 * * *" # every 12 hours
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Generate Snake
              uses: Platane/snk/svg-only@v3
              with:
                  github_user_name: ${{ github.repository_owner }}
                  outputs: |
                      dist/github-snake.svg?color_snake=#cba6f7&color_dots=#1e1e2e,#6e3fa0,#8b5fc7,#b4befe,#cba6f7
                      dist/github-snake-dark.svg?color_snake=#cba6f7&color_dots=#1e1e2e,#6e3fa0,#8b5fc7,#b4befe,#cba6f7

            - name: Push to output branch
              uses: crazy-max/ghaction-github-pages@v4
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
