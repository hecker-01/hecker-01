name: Generate Snake

on:
    schedule:
        - cron: "0 */12 * * *" # every 12 hours
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Generate Snake
              uses: Platane/snk/svg-only@v3
              with:
                  github_user_name: ${{ github.repository_owner }}
                  outputs: |
                      dist/github-snake.svg?color_snake=#c4a7f3&color_dots=#21212f,#473f5c,#6b5c87,#8f7bb3,#c4a7f3
                      dist/github-snake-dark.svg?color_snake=#c4a7f3&color_dots=#21212f,#473f5c,#6b5c87,#8f7bb3,#c4a7f3

            - name: Push to output branch
              uses: crazy-max/ghaction-github-pages@v4
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
